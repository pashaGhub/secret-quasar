<!doctype html>
<!-- Source of public/quasar/og.jpg (link-preview image, 1200×630). To change it: edit this file, then
     render it at exactly 1200×630 (e.g. Playwright/Chrome screenshot of this page) and save as JPEG
     to public/quasar/og.jpg, ideally under 200 KB. Paths below are relative to this file. -->
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Orbitron'; src: url('../../public/quasar/fonts/Orbitron-Variable.ttf'); font-weight: 400 900; }
  :root {
    --shift: 30%;        /* push the quasar to the right: higher = further right */
    --zoom: 1.05;        /* quasar size */
    --fade: 0.93;        /* darkness on the text side, 0–1 */
    --title: 108px;      /* title size */
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #000; }
  .bg {
    position: absolute; inset: 0;
    background: url('../../public/quasar/poster.jpg') 50% 50% / cover no-repeat;
    transform: translateX(var(--shift)) scale(var(--zoom));
    transform-origin: 62% 50%;
  }
  .shade {
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgb(0 0 0 / var(--fade)) 0%, rgb(0 0 0 / calc(var(--fade) * .86)) 34%, rgb(0 0 0 / .25) 62%, transparent 82%),
      radial-gradient(120% 90% at 100% 50%, transparent 50%, rgb(0 0 0 / .55) 100%);
  }
  .title {
    position: absolute; left: 72px; top: 50%; transform: translateY(-50%);
    font: 900 var(--title)/0.98 'Orbitron', sans-serif;
    letter-spacing: 0.02em; color: #eaf6ff;
    text-shadow: 0 0 36px rgb(64 242 255 / .45), 0 0 6px rgb(0 0 0 / .8);
  }
  .title span { display: block; }
  .title span + span {
    background: linear-gradient(90deg, #40f2ff, #a04dff 45%, #ff3fae 75%, #ff8a1f);
    -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none;
    filter: drop-shadow(0 0 22px rgb(160 77 255 / .45));
    padding-bottom: .12em; margin-bottom: -.12em;
  }
  .rule { position: absolute; left: 72px; top: 50%; margin-top: 150px; width: 120px; height: 3px;
    background: linear-gradient(90deg, #40f2ff, #ff3fae, #ff8a1f); box-shadow: 0 0 14px rgb(160 77 255 / .7); }
</style>
<div class="bg"></div>
<div class="shade"></div>
<div class="title"><span>SECRET</span><span>QUASAR</span></div>
<div class="rule"></div>
